services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro

  backend:
    build:
      context: ./backend
    working_dir: /workspace/backend
    command: >
      sh -c "uv sync --frozen --no-dev &&
      uv run python manage.py migrate --noinput &&
      uv run gunicorn cadence.wsgi:application --bind 0.0.0.0:8000"
    environment:
      CADENCE_REPO_ROOT: /workspace
      DJANGO_SETTINGS_MODULE: cadence.settings.dev
      UV_PROJECT_ENVIRONMENT: /opt/venv
      TASK_INBOX_PENDING_DIR: /workspace/data/task-inbox/pending
      TASK_INBOX_PROCESSING_DIR: /workspace/data/task-inbox/processing
      TASK_INBOX_PROCESSED_DIR: /workspace/data/task-inbox/processed
      TASK_INBOX_FAILED_DIR: /workspace/data/task-inbox/failed
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/workspace
      - static_files:/workspace/staticfiles
      - media_files:/workspace/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    working_dir: /workspace/frontend
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cadence}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-cadence}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
    working_dir: /workspace/backend
    command: >
      sh -c "uv sync --frozen --no-dev &&
      uv run celery -A cadence worker -l info -Q default,imports,notifications,reports,maintenance"
    environment:
      CADENCE_REPO_ROOT: /workspace
      DJANGO_SETTINGS_MODULE: cadence.settings.dev
      UV_PROJECT_ENVIRONMENT: /opt/venv
      TASK_INBOX_PENDING_DIR: /workspace/data/task-inbox/pending
      TASK_INBOX_PROCESSING_DIR: /workspace/data/task-inbox/processing
      TASK_INBOX_PROCESSED_DIR: /workspace/data/task-inbox/processed
      TASK_INBOX_FAILED_DIR: /workspace/data/task-inbox/failed
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/workspace
      - media_files:/workspace/media

  celery-beat:
    build:
      context: ./backend
    working_dir: /workspace/backend
    command: >
      sh -c "uv sync --frozen --no-dev &&
      uv run celery -A cadence beat -l info"
    environment:
      CADENCE_REPO_ROOT: /workspace
      DJANGO_SETTINGS_MODULE: cadence.settings.dev
      UV_PROJECT_ENVIRONMENT: /opt/venv
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/workspace

  flower:
    image: mher/flower:2.0
    profiles: ["dev"]
    command: celery --broker=${CELERY_BROKER_URL:-amqp://cadence:cadence@rabbitmq:5672//} flower
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "5555:5555"

volumes:
  postgres_data:
  rabbitmq_data:
  static_files:
  media_files:
  frontend_node_modules:
