# Cadence Docker Compose
#
# Build contexts (do not mix them up):
#   ./backend  -> backend/Dockerfile   (expects pyproject.toml, uv.lock in context root)
#   .          -> infra/nginx/Dockerfile (expects frontend/ and infra/ at context root)
#
# Profiles:
#   dev  — Vite HMR, nginx reverse proxy, Flower, optional telegram-bot
#   prod — baked SPA in nginx, gunicorn workers, collectstatic on startup
#
# Infra images are pinned; postgres major version must match existing volume data.

name: cadence

x-backend-common: &backend-common
  build:
    context: ./backend
  working_dir: /workspace/backend
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment: &backend-environment
    CADENCE_REPO_ROOT: /workspace
    UV_PROJECT_ENVIRONMENT: /opt/venv
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-cadence.settings.dev}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    DATABASE_URL: ${DATABASE_URL:-postgres://cadence:cadence@postgres:5432/cadence}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://cadence:cadence@rabbitmq:5672//}
    TASK_INBOX_PENDING_DIR: /workspace/data/task-inbox/pending
    TASK_INBOX_PROCESSING_DIR: /workspace/data/task-inbox/processing
    TASK_INBOX_PROCESSED_DIR: /workspace/data/task-inbox/processed
    TASK_INBOX_FAILED_DIR: /workspace/data/task-inbox/failed
  volumes:
    - .:/workspace

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cadence} -d ${POSTGRES_DB:-cadence}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cadence}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-cadence}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend-common
    environment:
      <<: *backend-environment
      CADENCE_SERVICE_NAME: api
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      GUNICORN_EXTRA_ARGS: ${GUNICORN_EXTRA_ARGS:---reload}
    volumes:
      - .:/workspace
      - static_data:/workspace/staticfiles
      - media_data:/workspace/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "uv sync --frozen --no-dev &&
      uv run python manage.py migrate --noinput &&
      if [ \"$$DJANGO_SETTINGS_MODULE\" = \"cadence.settings.prod\" ]; then
        uv run python manage.py collectstatic --noinput;
      fi &&
      exec uv run gunicorn cadence.wsgi:application --bind 0.0.0.0:8000 $$GUNICORN_EXTRA_ARGS"

  celery-worker:
    <<: *backend-common
    environment:
      <<: *backend-environment
      CADENCE_SERVICE_NAME: worker
    volumes:
      - .:/workspace
      - media_data:/workspace/media
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "uv sync --frozen --no-dev &&
      uv run celery -A cadence worker -l info -Q default,imports,notifications,reports,maintenance"

  celery-beat:
    <<: *backend-common
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "uv sync --frozen --no-dev &&
      uv run celery -A cadence beat -l info"

  nginx:
    profiles: [prod]
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - static_data:/usr/share/nginx/static:ro
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy

  nginx-dev:
    profiles: [dev]
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /workspace/frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

  flower:
    profiles: [dev]
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://cadence:cadence@rabbitmq:5672//}
    command: celery --broker=${CELERY_BROKER_URL:-amqp://cadence:cadence@rabbitmq:5672//} flower
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "5556:5555"

  telegram-bot:
    profiles: [dev, telegram]
    <<: *backend-common
    restart: unless-stopped
    environment:
      <<: *backend-environment
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >
      sh -c "uv sync --frozen --no-dev &&
      uv run python manage.py run_telegram_bot"

volumes:
  postgres_data:
  rabbitmq_data:
  static_data:
  media_data:
  frontend_node_modules:
