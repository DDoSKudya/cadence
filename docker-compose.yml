services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro

  backend:
    build:
      context: ./backend
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
      uv run gunicorn cadence.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: cadence.settings.dev
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cadence}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-cadence}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
    command: uv run celery -A cadence worker -l info -Q default,imports,notifications,reports,maintenance
    environment:
      DJANGO_SETTINGS_MODULE: cadence.settings.dev
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - media_files:/app/media

  celery-beat:
    build:
      context: ./backend
    command: uv run celery -A cadence beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: cadence.settings.dev
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./backend:/app
      - ./data:/app/data

  flower:
    image: mher/flower:2.0
    profiles: ["dev"]
    command: celery --broker=${CELERY_BROKER_URL:-amqp://cadence:cadence@rabbitmq:5672//} flower
    depends_on:
      - rabbitmq
    ports:
      - "5555:5555"

volumes:
  postgres_data:
  rabbitmq_data:
  static_files:
  media_files:
  frontend_node_modules:
