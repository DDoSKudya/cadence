default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^docs/openapi\.json$
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(backend|tools/launcher)/
      - id: ruff-format
        files: ^(backend|tools/launcher)/

  - repo: local
    hooks:
      - id: backend-mypy
        name: backend mypy
        entry: bash -c "cd backend && uv run mypy ."
        language: system
        files: ^backend/
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c "cd frontend && npm run typecheck"
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: django-makemigrations-check
        name: django makemigrations --check
        entry: bash -c "cd backend && DJANGO_SETTINGS_MODULE=cadence.settings.test uv run python manage.py makemigrations --check --dry-run"
        language: system
        files: ^backend/apps/.*/(models|migrations)/
        pass_filenames: false

  - repo: local
    hooks:
      - id: backend-pytest
        name: backend pytest
        entry: bash -c "cd backend && uv run pytest"
        language: system
        files: ^(backend/|tests/)
        pass_filenames: false
        stages: [pre-push]

      - id: launcher-pytest
        name: launcher pytest
        entry: bash -c "cd tools/launcher && uv sync --frozen --extra dev --quiet && uv run pytest -q"
        language: system
        files: ^tools/launcher/
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-test
        name: frontend vitest
        entry: bash -c "cd frontend && npm run test -- --run"
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-build
        name: frontend build
        entry: bash -c "cd frontend && npm run build"
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
