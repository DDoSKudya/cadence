[project]
name = "backend"
version = "1.0.0"
description = "Cadence backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram",
    "celery",
    "django",
    "django-environ",
    "django-unfold",
    "djangorestframework",
    "drf-spectacular",
    "gunicorn",
    "openpyxl",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "django-stubs",
    "djangorestframework-stubs",
    "factory-boy",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-django",
    "ruff",
    "time-machine",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]
"tests/*.py" = ["PLR2004"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cadence.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]
addopts = ["--cov=apps", "--cov-report=term-missing", "--cov-fail-under=85"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
strict = false

[tool.django-stubs]
django_settings_module = "cadence.settings.test"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.12"
typeCheckingMode = "basic"
