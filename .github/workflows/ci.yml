name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit
        run: uv tool run pre-commit run --all-files --show-diff-on-failure

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check
        working-directory: backend
        run: uv run mypy .

      - name: Check migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: cadence.settings.test
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test with coverage
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [pre-commit, backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose --profile dev --profile prod config --quiet

      - name: Build development images
        run: docker compose --profile dev build

      - name: Build production images
        run: docker compose --profile prod build
