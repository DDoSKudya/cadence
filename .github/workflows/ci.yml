name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run pre-commit
        run: mise run lint

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Test with coverage
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy . && DJANGO_SETTINGS_MODULE=cadence.settings.test uv run python manage.py makemigrations --check --dry-run && uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend verification
        working-directory: frontend
        run: npm run typecheck && npm run test -- --run && npm run build

  launcher:
    name: Launcher
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Install launcher dependencies
        working-directory: tools/launcher
        run: uv sync --frozen --extra dev

      - name: Run launcher tests
        working-directory: tools/launcher
        run: uv run pytest

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [pre-commit, backend, frontend, launcher]

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose --profile dev --profile prod config --quiet

      - name: Build development images
        run: docker compose --profile dev build

      - name: Build production images
        run: docker compose --profile prod build
